seed: 42
data:
  single_dir: data/single
  mixed_dir: data/mixed
  sample_rate: 1000000
  signal_length: 4096
  num_samples: 21000
  max_sources_per_mix: 3
  balanced_generation: true
  noise_std: 0.02
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
augmentation:
  enabled: true
  gain_range:
  - 0.1
  - 2.0
  noise_snr_db_range:
  - 10
  - 40
  random_dc_offset: true
  dc_offset_range:
  - -0.05
  - 0.05
  random_polarity_flip: true
  random_time_shift: true
  random_crop: true
  background_noise_enabled: true
  background_noise_scale_range:
  - 0.01
  - 0.2
  mix_normalization: rms
  source_dropout_prob: 0.0
training_data:
  mode: real_only
preprocessing:
  signal_normalization: none
balanced_train:
  enabled: false
sampler:
  enabled: true
  strategy: label_combo
real_data:
  single_dir: data/single
  combo_dir: data/real_dataset
  index_file: outputs/reports/real_dataset_index.csv
  split_file: outputs/reports/real_dataset_split.csv
real_split:
  enabled: true
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  split_by_group: true
train:
  epochs: 200
  batch_size: 32
  threshold: 0.5
  lr: 0.001
  device: auto
  num_workers: 0
optimizer:
  type: adamw
  weight_decay: 0.0001
model:
  architecture: residual
  base_channels: 32
  dropout: 0.2
  auxiliary_heads:
    enabled: true
    multilabel_loss_weight: 0.3
    combo_loss_weight: 1.0
    count_loss_weight: 0.3
  prediction:
    mode: structured
    combo_score_weight: 1.0
    multilabel_score_weight: 0.3
    count_score_weight: 0.2
loss:
  type: asymmetric_bce
  use_pos_weight: false
  gamma_neg: 3
  gamma_pos: 0
  label_smoothing: 0.02
  class_fp_penalty:
    source_1: 1.2
    source_3: 1.2
    source_5: 1.5
  class_fn_penalty:
    source_1: 1.0
    source_3: 1.0
    source_5: 2.0
early_stopping:
  enabled: true
  monitor: exact_match
  mode: max
  patience: 15
  min_delta: 0.001
cache:
  enabled: false
  dir: data/cache_stft
  rebuild: false
stft:
  nperseg: 256
  noverlap: 128
  target_freq_bins: 128
  target_time_bins: 64
  magnitude_scale: absolute
  input_representation: absolute_relative
scheduler:
  enabled: true
  type: ReduceLROnPlateau
  factor: 0.5
  patience: 5
paths:
  checkpoint_dir: outputs/checkpoints
  report_dir: outputs/reports
