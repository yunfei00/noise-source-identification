seed: 42
data:
  single_dir: data/single
  mixed_dir: data/mixed
  sample_rate: 1000000
  signal_length: 4096
  num_samples: 21000
  max_sources_per_mix: 3
  balanced_generation: true
  noise_std: 0.02
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
augmentation:
  enabled: true
  gain_range:
  - 0.1
  - 2.0
  noise_snr_db_range:
  - 10
  - 40
  random_dc_offset: true
  dc_offset_range:
  - -0.05
  - 0.05
  random_polarity_flip: true
  random_time_shift: true
  random_crop: true
  background_noise_enabled: true
  background_noise_scale_range:
  - 0.01
  - 0.2
  mix_normalization: rms
  source_dropout_prob: 0.0
training_data:
  mode: real_only
real_data:
  single_dir: data/single
  combo_dir: data/real_dataset
  index_file: outputs/reports/real_dataset_index.csv
  split_file: outputs/reports/real_dataset_split.csv
real_split:
  enabled: true
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  split_by_group: true
train:
  epochs: 200
  batch_size: 32
  threshold: 0.5
  lr: 0.001
  device: auto
  num_workers: 0
early_stopping:
  enabled: true
  monitor: micro_f1
  mode: max
  patience: 15
  min_delta: 0.001
cache:
  enabled: false
  dir: data/cache_stft
  rebuild: false
stft:
  nperseg: 256
  noverlap: 128
  target_freq_bins: 128
  target_time_bins: 64
scheduler:
  enabled: true
  type: ReduceLROnPlateau
  factor: 0.5
  patience: 5
paths:
  checkpoint_dir: outputs/checkpoints
  report_dir: outputs/reports
