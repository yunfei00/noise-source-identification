seed: 42

data:
  single_dir: data/single
  mixed_dir: data/mixed
  sample_rate: 1000000
  signal_length: 4096
  num_samples: 300
  max_sources_per_mix: 3
  balanced_generation: true
  noise_std: 0.02
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

stft:
  nperseg: 256
  noverlap: 128
  target_freq_bins: 128
  target_time_bins: 64

train:
  batch_size: 32
  epochs: 3
  lr: 0.001
  threshold: 0.5
  device: auto
  num_workers: 0

paths:
  checkpoint_dir: outputs/checkpoints
  report_dir: outputs/reports
